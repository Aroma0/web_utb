<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido en Proceso</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
</head>
<body>

<div id="pantalla-pedido" style="
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
    color: #000000;
    text-align: center;
">
    <!-- Texto arriba -->
    <h1 id="texto-estado" style="font-size: 30px; font-family: Arial, sans-serif;">
        REALIZANDO PEDIDO
    </h1>

    <!-- Contador -->
    <h2 id="contador" style="font-size: 24px; margin-bottom: 10px;">20</h2>

    <!-- GIF centrado -->
    <img id="gif" src="img/cocinando.gif" 
         alt="GIF Pantalla Completa" 
         style="width: 500px; height: auto;"> 

    <!-- Botón volver -->
    <a href="index.html" class="btn btn-warning mt-3" style="width: 50%;">VOLVER</a>
</div>

<!-- SCRIPT DEL CONTADOR -->
<script>
  let tiempo = 20; // segundos
  const contador = document.getElementById("contador");
  const textoEstado = document.getElementById("texto-estado");
  const gif = document.getElementById("gif");

  const intervalo = setInterval(() => {
    tiempo--;
    contador.textContent = tiempo;

    if (tiempo <= 0) {
      clearInterval(intervalo);
      textoEstado.textContent = "PEDIDO LISTO";
      contador.style.display = "none";
      gif.src = "img/PAPAS.gif"; // 📌 Cambia por tu imagen final
      textoEstado.textContent = "PEDIDO LISTO — ¡ACÉRQUESE A CAJA!";
    }
  }, 1000);
</script>

</body>
</html>
